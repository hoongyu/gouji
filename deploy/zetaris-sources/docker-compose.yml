# Local stand-ins for the buyer's systems on the Zetaris path. PostgreSQL holds the ERP and the vendor
# master as two databases; an S3-compatible store holds the contracts, the mailbox and the registry as
# files. Zetaris reaches both through host.docker.internal. Passwords come from .env in this folder,
# which `python scripts/zetaris_sources.py up` generates and git ignores.
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: gouji
      POSTGRES_PASSWORD: ${GOUJI_PG_PASSWORD:?run scripts/zetaris_sources.py up}
    ports: ["5433:5432"]
    volumes: [pg:/var/lib/postgresql/data]
  s3:
    # S3-compatible store for the three files. MinIO no longer publishes community images, so this is
    # Adobe's S3Mock, pinned by digest; it creates the bucket at startup and accepts the local credentials.
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: gouji
      initialBuckets: gouji
    ports: ["9000:9090"]
volumes:
  pg:
